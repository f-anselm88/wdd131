<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a review for your product, including a rating, installation date and the features you found useful.">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <div class="field">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="rating">
                <legend>Overall Rating</legend>
                <div class="rating-options">
                    <div class="rating-option">
                        <label for="rating1" aria-label="1 star">&starf;</label>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </div>
                    <div class="rating-option">
                        <label for="rating2" aria-label="2 stars">&starf;&starf;</label>
                        <input type="radio" id="rating2" name="rating" value="2">
                    </div>
                    <div class="rating-option">
                        <label for="rating3" aria-label="3 stars">&starf;&starf;&starf;</label>
                        <input type="radio" id="rating3" name="rating" value="3">
                    </div>
                    <div class="rating-option">
                        <label for="rating4" aria-label="4 stars">&starf;&starf;&starf;&starf;</label>
                        <input type="radio" id="rating4" name="rating" value="4">
                    </div>
                    <div class="rating-option">
                        <label for="rating5" aria-label="5 stars">&starf;&starf;&starf;&starf;&starf;</label>
                        <input type="radio" id="rating5" name="rating" value="5">
                    </div>
                </div>
            </fieldset>

            <div class="field">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="features">
                <legend>Which features did you find useful in the product?</legend>
                <p class="hint">(Check all that apply)</p>
                <div class="checkbox-row">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    <label for="durability">Durability</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                    <label for="easeOfUse">Ease of Use</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    <label for="performance">Performance</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="design" name="features" value="Design">
                    <label for="design">Design</label>
                </div>
            </fieldset>

            <div class="field">
                <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="6"></textarea>
            </div>

            <div class="field">
                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName" autocomplete="name">
            </div>

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> 🌸 Anselm Munango 🌸</p>
        <p>Namibia</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
