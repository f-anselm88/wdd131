<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
  <title id="t">Kavango Region Landscape</title>
  <desc id="d">Okavango River at sunrise with riverine woodland, reeds, a fisherman in a mokoro, a thatched homestead and elephants on the bank.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f93c4"/>
      <stop offset="0.55" stop-color="#f1d9a6"/>
      <stop offset="1" stop-color="#f7bf74"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffd98a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b068"/>
      <stop offset="0.5" stop-color="#a99a56"/>
      <stop offset="1" stop-color="#8c7a42"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0d6"/>
      <stop offset="0.5" stop-color="#4c9cb3"/>
      <stop offset="1" stop-color="#276f8a"/>
    </linearGradient>

    <g id="tree">
      <path d="M0 0 C-2 -35 -6 -55 -22 -85 M-2 -45 C4 -65 14 -80 30 -95" stroke="#4a3322" stroke-width="7" fill="none" stroke-linecap="round"/>
      <ellipse cx="-24" cy="-92" rx="38" ry="14" fill="#3f6b3a"/>
      <ellipse cx="32" cy="-102" rx="34" ry="12" fill="#477a40"/>
      <ellipse cx="0" cy="-114" rx="30" ry="11" fill="#55894c"/>
    </g>

    <g id="tuft">
      <path d="M0 0 Q-6 -20 -14 -34 Q-2 -22 2 0 Z M0 0 Q2 -28 6 -44 Q8 -24 6 0 Z M2 0 Q12 -18 22 -26 Q12 -12 8 0 Z"/>
    </g>

    <g id="reed" stroke="#5f7f33" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M0 0 Q-3 -40 -10 -70"/>
      <path d="M0 0 Q2 -50 4 -80"/>
      <path d="M0 0 Q6 -40 16 -64"/>
      <path d="M4 0 Q10 -30 24 -48"/>
    </g>

    <g id="elephant" fill="#6e6458">
      <ellipse cx="0" cy="-26" rx="24" ry="15"/>
      <circle cx="-26" cy="-32" r="11"/>
      <path d="M-34 -28 Q-42 -14 -38 0 Q-34 -2 -33 -8 Q-31 -18 -28 -24 Z"/>
      <ellipse cx="-20" cy="-30" rx="7" ry="10" fill="#5d544a"/>
      <rect x="-16" y="-18" width="7" height="18" rx="2"/>
      <rect x="-4" y="-16" width="7" height="16" rx="2"/>
      <rect x="9" y="-16" width="7" height="16" rx="2"/>
      <rect x="18" y="-18" width="7" height="18" rx="2"/>
      <path d="M24 -32 Q30 -26 28 -16" stroke="#6e6458" stroke-width="2" fill="none"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="1000" height="600" fill="url(#sky)"/>
  <circle cx="760" cy="190" r="160" fill="url(#sunGlow)"/>
  <circle cx="760" cy="190" r="42" fill="#fff0b8"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="190" cy="110" rx="90" ry="14"/>
    <ellipse cx="240" cy="98" rx="55" ry="12"/>
    <ellipse cx="520" cy="150" rx="110" ry="12"/>
    <ellipse cx="470" cy="140" rx="50" ry="10"/>
    <ellipse cx="900" cy="90" rx="70" ry="10"/>
  </g>

  <!-- Distant haze and woodland -->
  <path d="M0 330 Q120 300 240 322 T480 316 T720 324 T1000 310 L1000 360 L0 360 Z" fill="#a9b58a" opacity="0.7"/>
  <path d="M0 345 Q80 320 170 338 T340 332 T520 340 T700 330 T860 338 T1000 328 L1000 380 L0 380 Z" fill="#6f9264"/>
  <path d="M0 358 Q60 338 130 352 T260 348 T400 356 T560 350 T720 356 T880 348 T1000 354 L1000 400 L0 400 Z" fill="#587f50"/>

  <!-- Ground -->
  <path d="M0 360 L1000 350 L1000 600 L0 600 Z" fill="url(#ground)"/>
  <path d="M0 380 Q200 365 400 372 T800 366 T1000 372 L1000 400 L0 400 Z" fill="#7da15a" opacity="0.5"/>

  <!-- River -->
  <path d="M420 335 C400 380 300 440 120 600 L1000 600 L1000 500 C800 440 560 390 450 335 Z" fill="url(#river)"/>
  <path d="M420 335 C400 380 300 440 120 600" fill="none" stroke="#e6d9a0" stroke-width="3" opacity="0.8"/>
  <path d="M450 335 C560 390 800 440 1000 500" fill="none" stroke="#e6d9a0" stroke-width="3" opacity="0.8"/>

  <!-- Sun reflection and ripples -->
  <g stroke="#fff3c4" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M690 425 L740 428" stroke-width="3"/>
    <path d="M670 440 L760 446" stroke-width="3"/>
    <path d="M650 458 L775 466" stroke-width="2.5"/>
    <path d="M700 480 L790 488" stroke-width="2"/>
  </g>
  <g stroke="#ffffff" stroke-linecap="round" fill="none" opacity="0.35">
    <path d="M300 520 L380 512" stroke-width="2"/>
    <path d="M420 540 L520 530" stroke-width="2"/>
    <path d="M560 570 L680 556" stroke-width="2"/>
    <path d="M360 480 L420 470" stroke-width="1.5"/>
    <path d="M480 450 L540 444" stroke-width="1.5"/>
  </g>

  <!-- Distant trees -->
  <use xlink:href="#tree" transform="translate(120 352) scale(0.32)"/>
  <use xlink:href="#tree" transform="translate(210 356) scale(0.3)"/>
  <use xlink:href="#tree" transform="translate(300 350) scale(0.28)"/>
  <use xlink:href="#tree" transform="translate(590 350) scale(0.3)"/>
  <use xlink:href="#tree" transform="translate(680 352) scale(0.34)"/>
  <use xlink:href="#tree" transform="translate(940 350) scale(0.36)"/>

  <!-- Mid-ground trees -->
  <use xlink:href="#tree" transform="translate(330 372) scale(0.55)"/>
  <use xlink:href="#tree" transform="translate(720 370) scale(0.55)"/>
  <use xlink:href="#tree" transform="translate(860 392) scale(0.85)"/>

  <!-- Elephants -->
  <use xlink:href="#elephant" transform="translate(790 424) scale(0.8)"/>
  <use xlink:href="#elephant" transform="translate(842 432) scale(0.6)"/>

  <!-- Reeds along the banks -->
  <use xlink:href="#reed" transform="translate(335 428)"/>
  <use xlink:href="#reed" transform="translate(300 454) scale(1.1)"/>
  <use xlink:href="#reed" transform="translate(255 492) scale(1.25)"/>
  <use xlink:href="#reed" transform="translate(205 540) scale(1.4)"/>
  <use xlink:href="#reed" transform="translate(575 380) scale(0.6)"/>
  <use xlink:href="#reed" transform="translate(630 398) scale(0.75)"/>
  <use xlink:href="#reed" transform="translate(700 424) scale(0.9)"/>
  <use xlink:href="#reed" transform="translate(880 470) scale(1.1)"/>
  <use xlink:href="#reed" transform="translate(950 490) scale(1.3)"/>

  <!-- Homestead on left bank -->
  <g transform="translate(150 436)">
    <rect x="-34" y="-34" width="68" height="34" fill="#c9a06a"/>
    <path d="M-48 -32 L0 -78 L48 -32 Z" fill="#a98445"/>
    <path d="M-48 -32 L0 -78 L48 -32" fill="none" stroke="#8a6a33" stroke-width="2"/>
    <rect x="-8" y="-24" width="16" height="24" fill="#5b3f26"/>
    <path d="M60 0 L60 -26 M74 0 L74 -22 M88 0 L88 -26" stroke="#6b4a2a" stroke-width="3"/>
    <path d="M56 -26 L92 -26" stroke="#6b4a2a" stroke-width="3"/>
  </g>

  <!-- Large foreground trees -->
  <use xlink:href="#tree" transform="translate(50 470) scale(1.5)"/>
  <use xlink:href="#tree" transform="translate(960 470) scale(1.3)"/>

  <!-- Mokoro with fisherman -->
  <g transform="translate(560 492)">
    <ellipse cx="55" cy="14" rx="70" ry="4" fill="#1f5a70" opacity="0.5"/>
    <path d="M-10 0 Q50 14 120 -6 Q60 6 -10 0 Z" fill="#5b3a21"/>
    <path d="M-10 0 Q50 10 120 -6" fill="none" stroke="#3a2414" stroke-width="2"/>
    <g fill="#2a1d14" stroke="#2a1d14">
      <circle cx="58" cy="-48" r="6" stroke="none"/>
      <path d="M58 -42 L58 -16 M58 -36 L46 -24 M58 -36 L72 -28 M58 -16 L52 -2 M58 -16 L64 -2" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M72 -28 L96 8" stroke="#6b4a2a" stroke-width="2.5" fill="none"/>
    </g>
    <path d="M90 8 Q98 14 106 8" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Foreground grass -->
  <g fill="#4d7a2e">
    <use xlink:href="#tuft" transform="translate(30 595) scale(1.6)"/>
    <use xlink:href="#tuft" transform="translate(90 590) scale(1.2)"/>
    <use xlink:href="#tuft" transform="translate(150 598) scale(1.8)"/>
    <use xlink:href="#tuft" transform="translate(20 540) scale(1)"/>
    <use xlink:href="#tuft" transform="translate(110 520) scale(0.9)"/>
  </g>
  <g fill="#5c8a38">
    <use xlink:href="#tuft" transform="translate(880 596) scale(1.7)"/>
    <use xlink:href="#tuft" transform="translate(940 588) scale(1.3)"/>
    <use xlink:href="#tuft" transform="translate(980 598) scale(1.5)"/>
    <use xlink:href="#tuft" transform="translate(920 530) scale(1)"/>
    <use xlink:href="#tuft" transform="translate(830 500) scale(0.8)"/>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#3b3b3b" stroke-width="2" stroke-linecap="round">
    <path d="M560 120 Q570 110 580 120 Q590 110 600 120"/>
    <path d="M620 150 Q628 142 636 150 Q644 142 652 150"/>
    <path d="M420 190 Q428 182 436 190 Q444 182 452 190"/>
  </g>
</svg>
