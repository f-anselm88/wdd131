<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album</title>

  <!-- Mobile-first CSS: base/mobile styles load first, larger-view overrides load second -->
  <link rel="stylesheet" href="styles/temples.css">

<body>

  <header>

  <footer>
    <p>&copy; <span id="currentyear"></span> Anselm Munango | Windhoek, Namibia</p>
