<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive, filterable photo gallery of temples of The Church of Jesus Christ of Latter-day Saints, built for WDD 131 Week 04.">
  <meta name="author" content="Anselm Munango">
  <title>Filtered Temple Album</title>

  <!-- Google Fonts: preconnect first, then the stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Mobile-first CSS: base/mobile styles load first, larger-view overrides load second -->
  <link rel="stylesheet" href="styles/filtered-temples.css">
  <link rel="stylesheet" href="styles/filtered-temples-large.css">

  <!-- Deferred JS: parses in parallel with HTML, executes after DOM is built -->
  <script src="scripts/filtered-temples.js" defer></script>
</head>
<body>

  <header>
    <p class="site-name">Temple Album</p>
    <button id="menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">&#9776;</button>
    <nav>
      <ul>
        <li><a href="#" data-filter="home" class="active">Home</a></li>
        <li><a href="#" data-filter="old">Old</a></li>
        <li><a href="#" data-filter="new">New</a></li>
        <li><a href="#" data-filter="large">Large</a></li>
        <li><a href="#" data-filter="small">Small</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Temples of The Church of Jesus Christ of Latter-day Saints</h1>

    <div class="gallery" id="temple-cards">
      <!-- Temple cards are generated by scripts/filtered-temples.js -->
    </div>

  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Anselm Munango | Windhoek, Namibia</p>
    <p>Last Modification: <span id="lastModified"></span></p>
  </footer>

</body>
</html>
